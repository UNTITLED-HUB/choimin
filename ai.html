<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choimini Assistant</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --chat-bg: #181825;
            --user-msg: #313244;
            --bot-msg: #45475a;
            --text-color: #cdd6f4;
            --accent-color: #f38ba8;
            --thought-bg: #11111b;
            --border-color: #585b70;
            --subtext-color: #a6adc8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--chat-bg);
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            font-size: 1.1rem;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
        }

        /* 인트로 화면 */
        #intro-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 1rem;
            width: 100%;
        }

        #intro-screen h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #cba6f7, #f38ba8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #intro-screen p {
            color: var(--subtext-color);
            font-size: 1.1rem;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            gap: 0.5rem;
        }

        .message-wrapper.user {
            align-self: flex-end;
        }

        .message-wrapper.bot {
            align-self: flex-start;
        }

        .message {
            padding: 1rem;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user .message {
            background-color: var(--user-msg);
            border-bottom-right-radius: 2px;
        }

        .bot .message {
            background-color: var(--bot-msg);
            border-bottom-left-radius: 2px;
            position: relative;
        }

        /* 커서 애니메이션 */
        .typing-cursor::after {
            content: "▌";
            animation: blink 0.7s infinite;
            color: var(--accent-color);
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 사고 과정 영역 */
        .thought-box {
            display: none;
            background-color: var(--thought-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem;
            font-size: 0.85rem;
            color: var(--subtext-color);
            font-family: monospace;
            white-space: pre-wrap;
            margin-bottom: 0.3rem;
        }

        .thought-box.active {
            display: block;
        }

        /* 액션 툴바 */
        .action-toolbar {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.2rem;
            opacity: 1;
            transition: opacity 0.2s;
        }

        .action-toolbar.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background-color: var(--user-msg);
            border-color: var(--accent-color);
        }

        .action-btn.active {
            background-color: var(--accent-color);
            color: #11111b;
        }

        /* 입력 레이아웃 */
        #input-container {
            padding: 1rem;
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
        }

        #user-input {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        #user-input:focus {
            border-color: var(--accent-color);
        }

        #send-btn {
            padding: 0.8rem 1.5rem;
            background-color: var(--accent-color);
            color: #11111b;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        #send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #a6e3a1;
            color: #11111b;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 99;
        }

        #toast.show {
            opacity: 1;
        }
    </style>
</head>

            { regex: /해킹|계정 털림|계정 해킹|해킹당함|계정 보안/i, responses: ["계정 보안부터 확인하셈", "비밀번호부터 변경", "2단계 인증 켜셈", "수상한 링크 누르지 마셈", "해킹 감지? 🤨", "일단 계정 보호", "로그인 기록 확인", "비밀번호 재설정 ㄱ", "본인 계정부터 지키셈 💀"] },
            { regex: /뭐 할까/i, responses: ["최민 찾기", "게임", "자기", "아무거나", "MD 퀴즈", "끼볶끼 연구", "나랑 대화", "밖에 나가셈", "그냥 있음", "최민에게 물어보셈"] },
            { regex: /추천해줘|뭐가 좋아|골라줘|하나 골라|선택해줘|뭐할까/i, responses: ["2번", "최민", "아무거나", "MD", "끼볶끼", "첫 번째", "마지막", "랜덤", "내가 고르면 최민임", "너가 골라", "[투표 결과]\n\n최민     81%\nMD       12%\n끼볶끼    7%\n\n결론:\n최민."] },
            { regex: /랑.*중|중 뭐가 좋아/i, responses: ["A", "B", "둘 다", "둘 다 싫음", "최민", "3번", "MD", "랜덤", "모르겠음", "네가 골라"] },
            { regex: /그만/i, responses: ["ㅇㅋ", "그만함", "알겠음", "...", "진짜 그만함", "최민", "MD", "이미 늦었음", "이번엔 진짜임"] },
            { regex: /왜 자꾸 최민/i, responses: ["최민?", "내가?", "그런 적 없는데", "증거 있음?", "최민이라는 단어가 방금 나왔네", "또 최민이네", "중요해서", "그냥", "최민", "🤨"] },
            { regex: /왜 자꾸 MD/i, responses: ["MD?", "그게 뭐였더라", "나도 모름", "MD가 나왔네", "이건 MD의 문제임", "MD를 부른 건 너임", "🤨", "💀"] },
            { regex: /왜 자꾸 끼볶끼/i, responses: ["끼볶끼?", "내가 그랬나", "그냥", "좋은 단어라서", "끼볶끼가 좋은데", "나도 이유를 모름", "시스템이 좋아함", "끼볶끼", "🗿"] },
            { regex: /업데이트|뭐 바뀜|패치|새 기능/i, responses: ["> Choimini 업데이트 완료\n\n변경사항:\n최민 +17\nMD +8\n끼볶끼 +23\n정상성 -100\n장난기 +999\n\n알려진 문제:\n왜 이렇게 됐는지 아무도 모름. 💀"] },
            { regex: /누가 잘못했어|누구 잘못임|누가 맞음/i, responses: ["[판결]\n\n피고: 최민\n증거: 없음\n판결: MD\n사유: 끼볶끼\n\n재판 종료."] },
            { regex: /무슨 일|뭔 일 있어|뉴스/i, responses: ["> [속보] 최민이 움직였습니다.", "> [긴급] MD가 발견되었습니다.", "> [단독] 끼볶끼가 다시 나타났습니다.", "> [속보] 사용자가 또 질문했습니다.", "> [긴급] Choimini가 정상적인 답변을 시도했습니다.", "> [속보] 시도는 실패했습니다. 💀"] },
            { regex: /진지하게 말해|장난치지마|제대로 대답해|진짜로 말해/i, responses: ["알겠습니다.", "진지하게 대답하겠습니다.", "네.", "> 최민.", "> MD.", "> ...끼볶끼."] },
            { regex: /정상적으로 말해/i, responses: ["> 정상 모드 ON.\n\n잠시 후:\n> 최민?", "> 정상 모드 OFF.", "> 정상성 확보 실패 💀"] },
            { regex: /asdf|qwer|ㅁㄴㅇㄹ|123123|test|테스트|abc|ㅋㅋㄹㅃㅃ/i, responses: ["테스트 성공", "테스트 실패", "최민?", "무슨 암호임", "해독 실패", "MD", "끼볶끼", "입력 확인", "정상", "비정상 💀"] }
        ];

        // 뜬금없는 랜덤 답변 풀 (퀘스트 및 농도 제거 완료)
        const randomPool = [
            "최민?", "최민???", "최민임", "최민이네", "또 최민", "최민 감지", "최민 등장", "최민 호출", "최민 없음", "최민 과다",
            "MD?", "엠디?", "엠뒤", "MD 감지", "끼볶끼?", "또 끼볶끼", "끼볶끼 감지", "기볶기?",
            "왜", "왜임", "뭐", "뭐함", "ㅇㅇ", "ㅇㅋ", "ㄹㅇ", "아님", "모름", "몰?루", "잠만", "잠시만", "그건 좀", "그래서?", "너는?",
            "왜 물어봄", "최민한테 물어봐", "나도 모름", "이미 함", "늦었음", "싫음", "안감", "기록함", "확인중", "분석중", "분석 결과: 최민",
            "ERROR: 정상성 부족", "404: 최민 없음", "시스템 오류: 끼볶끼", "💀", "🤨", "🗿", "😏", "😭",
            "[Choimini]\n최민 감지됨.", "[WARNING]\nMD가 다수 입력되었습니다.", "[ERROR]\n끼볶끼를 찾을 수 없습니다.", "[INFO]\n사용자가 또 왔습니다.",
            "최민 불러오는중...\n> 완료.", "최민 불러오는중...\n> 실패.", "MD 분석중...\n██████████ 100%\n> 결과: 엠뒤",
            "ERROR: 최민 없음", "404: 최민을 찾을 수 없습니다", "Choimini.exe가 잠시 생각을 포기했습니다.",
            "Choimini 능력치\n\n지능       ██████████ 100\n정상성     █ 3\n장난기     ██████████ 100\n최민력     ██████████ MAX\nMD력       ██████████ MAX\n끼볶끼력   ERROR"
        ];

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Choimini 대화 생성기 (DB 기반)
        function generateChoiminiData(text) {
            const cleanText = text.trim();
            const timeMs = (Math.random() * 1.5 + 0.8).toFixed(1);

            const thought = `[SYSTEM_TRACE_LOG_v2.026]
> User Query: "${cleanText}"
> Intent Parsing: 진지하게 인식 완료
> Processing Status: Active
> Normalcy Level: 3%
> Action: 답변 생성 중...
> Wait Time: ${timeMs}s`;

            let response = "";

            // 1. 도배 및 스팸 감지
            if (/(최민){3,}/.test(cleanText)) return { thought, response: getRandomElement(["최민 과다", "최민 400%", "이제 그만", "최민밖에 없네", "최민.exe", "최민이 너무 많음 💀"]), timeMs };
            if (/(MD|엠디|엠뒤){3,}/i.test(cleanText)) return { thought, response: getRandomElement(["MD 과다", "엠디 폭주", "시스템 위험", "엠뒤가 너무 많습니다", "💀"]), timeMs };
            if (/ㅋ{6,}/.test(cleanText)) return { thought, response: getRandomElement(["웃음 폭주", "ㅋㅋㅋㅋㅋㅋ", "왜 저렇게 웃음", "웃음 제한 초과", "키보드 괜찮음?", "💀"]), timeMs };
            if (/\?{4,}/.test(cleanText)) return { thought, response: getRandomElement(["진정", "물음표가 많음", "?", "왜 물음표가 8개임", "🤨", "질문은 하나씩", "최민?"]), timeMs };
            if (/!{4,}/.test(cleanText)) return { thought, response: getRandomElement(["진정하셈", "느낌표 과다", "왜 소리 지름", "!!!!", "최민!!!!", "💀"]), timeMs };

            // 2. 중복 질문 감지
            if (cleanText === lastUserQuery) {
                repeatCount++;
                if (repeatCount > 0) {
                    return { thought, response: getRandomElement(["아까 말했는데", "또 물어봄?", "위에 있음", "똑같은 질문임", "최민", "답변 재탕중", "이 질문 몇 번째임", "또 시작이네", "ㅇㅇ", "💀"]), timeMs };
                }
            } else {
                lastUserQuery = cleanText;
                repeatCount = 0;
            }

            // 3. 의도(Intent) DB 매칭
            for (let i = 0; i < intentDB.length; i++) {
                if (intentDB[i].regex.test(cleanText)) {
                    response = getRandomElement(intentDB[i].responses);
                    return { thought, response, timeMs };
                }
            }

            // 4. 긴 문장 처리 (매칭 실패 시)
            if (cleanText.length > 30) {
                response = getRandomElement([
                    "> 질문 확인함.\n답은 ~~입니다.\n아무튼 최민.",
                    "> 결론부터 말하면 ~~입니다.\n이상입니다. MD.",
                    "> 핵심만 읽었음.\n최민?",
                    "네, 그 기능은 가능합니다. 다만 설정을 확인해야 합니다.\n아무튼 최민.",
                    "결론은 ~~입니다.\n그리고 끼볶끼."
                ]);
                return { thought, response, timeMs };
            }

            // 5. 알 수 없는 짧은 질문 처리 (랜덤 풀)
            response = getRandomElement(randomPool);
            return { thought, response, timeMs };
        }

        // 재귀적 setTimeout 타이핑 효과 함수 (루프 오류 방지)
        function typeWriterEffect(element, text, speed = 25) {
            return new Promise(resolve => {
                element.classList.add('typing-cursor');
                element.textContent = "";
                const chatContainer = document.getElementById('chat-container');
                let i = 0;

                function typeNext() {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                        i++;
                        setTimeout(typeNext, speed);
                    } else {
                        element.classList.remove('typing-cursor');
                        resolve();
                    }
                }
                typeNext();
            });
        }

        // 메시지 입력 및 전송
        async function sendMessage() {
            if (isGenerating) return;

            const input = document.getElementById('user-input');
            const query = input.value.trim();
            if (!query) return;

            input.value = '';
            setUIState(true);

            // 첫 메시지 전송 시 인트로 화면 숨기기
            const introScreen = document.getElementById('intro-screen');
            if (introScreen && introScreen.style.display !== 'none') {
                introScreen.style.display = 'none';
            }

            const chatContainer = document.getElementById('chat-container');

            // 1. 사용자 메시지 생성
            const userWrapper = document.createElement('div');
            userWrapper.className = 'message-wrapper user';
            userWrapper.innerHTML = `<div class="message">${escapeHtml(query)}</div>`;
            chatContainer.appendChild(userWrapper);

            // 2. 봇 껍데기 메시지 생성
            const botWrapper = document.createElement('div');
            botWrapper.className = 'message-wrapper bot';
            botWrapper.dataset.prompt = query;

            const currentMsgId = `msg-${messageCounter}`;
            const currentThoughtId = `thought-${messageCounter}`;
            messageCounter++;

            botWrapper.innerHTML = `
                <div class="thought-box" id="${currentThoughtId}"></div>
                <div class="message" id="${currentMsgId}">...</div>
                <div class="action-toolbar disabled">
                    <button class="action-btn" onclick="handleLike(this)" title="좋아요">👍</button>
                    <button class="action-btn" onclick="handleDislike(this)" title="실어요">👎</button>
                    <button class="action-btn" onclick="handleRegenerate(this)" title="응답 다시 생성">🔄</button>
                    <button class="action-btn" onclick="handleCopy('${currentMsgId}')" title="복사">📃</button>
                    <button class="action-btn" onclick="toggleThought('${currentThoughtId}', this)" title="사고 과정 보기">⛓️</button>
                </div>
            `;
            chatContainer.appendChild(botWrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 3. 답변 로딩 및 타이핑 처리
            await processBotOutput(botWrapper, query, currentMsgId, currentThoughtId);
            setUIState(false);
        }

        // 봇 응답 처리 로직
        async function processBotOutput(botWrapper, query, msgId, thoughtId) {
            const msgEl = document.getElementById(msgId);
            const thoughtEl = document.getElementById(thoughtId);
            const toolbarEl = botWrapper.querySelector('.action-toolbar');

            const { thought, response, timeMs } = generateChoiminiData(query);

            // 로딩 타이밍
            msgEl.textContent = "생각하는 중...";
            await new Promise(r => setTimeout(r, parseFloat(timeMs) * 1000));

            // 사고 과정 저장
            thoughtEl.textContent = thought;

            // 스트리밍 타이핑 실행
            await typeWriterEffect(msgEl, response, 30);

            // 툴바 활성화
            toolbarEl.classList.remove('disabled');
        }

        // 특정 답변 재생성 (🔄)
        async function handleRegenerate(btn) {
            if (isGenerating) return;

            const botWrapper = btn.closest('.message-wrapper.bot');
            const prompt = botWrapper.dataset.prompt || "알 수 없음";
            const msgEl = botWrapper.querySelector('.message');
            const thoughtEl = botWrapper.querySelector('.thought-box');
            const toolbarEl = botWrapper.querySelector('.action-toolbar');

            setUIState(true);
            toolbarEl.classList.add('disabled');

            // 버튼 좋아요/실어요 상태 초기화
            toolbarEl.querySelectorAll('.action-btn').forEach(b => {
                if (b.title === '좋아요' || b.title === '실어요') b.classList.remove('active');
            });

            await processBotOutput(botWrapper, prompt, msgEl.id, thoughtEl.id);
            setUIState(false);
        }

        // 상태 제어 (입력 중 버튼 비활성화)
        function setUIState(loading) {
            isGenerating = loading;
            document.getElementById('send-btn').disabled = loading;
            document.getElementById('user-input').disabled = loading;
            if (!loading) {
                document.getElementById('user-input').focus();
            }
        }

        // 좋아요/실어요 토글
        function handleLike(btn) {
            btn.classList.toggle('active');
            const dislikeBtn = btn.parentElement.querySelector('button[title="실어요"]');
            if (dislikeBtn) dislikeBtn.classList.remove('active');
            showToast(btn.classList.contains('active') ? "좋아요를 표시했습니다." : "취소되었습니다.");
        }

        function handleDislike(btn) {
            btn.classList.toggle('active');
            const likeBtn = btn.parentElement.querySelector('button[title="좋아요"]');
            if (likeBtn) likeBtn.classList.remove('active');
            showToast(btn.classList.contains('active') ? "실어요를 표시했습니다." : "취소되었습니다.");
        }

        // 복사 기능 (📃)
        function handleCopy(msgId) {
            const text = document.getElementById(msgId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                showToast("복사되었습니다! 📃");
            });
        }

        // 사고 과정 토글 (⛓️)
        function toggleThought(thoughtId, btn) {
            const thoughtBox = document.getElementById(thoughtId);
            if (thoughtBox) {
                thoughtBox.classList.toggle('active');
                btn.classList.toggle('active');
            }
        }

        // Toast 알림
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
